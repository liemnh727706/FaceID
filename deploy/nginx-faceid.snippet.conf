# Đoạn cần THÊM vào server{} block (phần HTTPS, port 443) của
# /home/ubuntu/cropguard/nginx/nginx.conf hiện có — KHÔNG tạo domain/server block mới, vì cert
# hiện tại chỉ có 1 tên (cropnlu.duckdns.org), dùng path prefix để khỏi phải xin cert mới.
#
# Đặt block này TRƯỚC location / (cropguard) để khớp path /faceid/ trước, không bị nuốt bởi "/".

    location /faceid/ {
        proxy_pass http://faceid:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ảnh chụp có thể vài MB, tăng giới hạn body mặc định (1MB) của nginx
        client_max_body_size 15m;

        # InsightFace + PaddleOCR có thể mất vài giây cho request đầu (nạp model)
        proxy_read_timeout 60s;
    }
